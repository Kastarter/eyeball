services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eyeball
      POSTGRES_USER: eyeball
      POSTGRES_PASSWORD: eyeball_dev
    ports:
      - "5432:5432"
    volumes:
      - eyeball-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyeball -d eyeball"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eyeball-postgres:
