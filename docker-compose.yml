services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${EYEBALL_PG_DB:-eyeball}
      POSTGRES_USER: ${EYEBALL_PG_USER:-eyeball}
      # Local development only — set EYEBALL_PG_PASSWORD for anything shared.
      POSTGRES_PASSWORD: ${EYEBALL_PG_PASSWORD:-eyeball_dev}
    ports:
      # Loopback-only: never expose the dev database on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - eyeball-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eyeball -d eyeball"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eyeball-postgres:
