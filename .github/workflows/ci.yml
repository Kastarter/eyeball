name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=2048
      VITEST_MAX_THREADS: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release metadata
        run: |
          pnpm changeset:status
          pnpm release:version

      - name: Generate documentation references
        run: pnpm docs:generate

      - name: Check generated documentation drift
        run: git diff --exit-code -- docs-site/docs.json docs-site/toolkits/generated docs-site/sdk/generated

      - name: Validate documentation structure
        run: pnpm turbo run docs:check --concurrency=1

      - name: Typecheck documentation snippets
        run: pnpm docs:snippets

      - name: Typecheck documentation tooling
        run: pnpm docs:typecheck

      - name: Build
        run: pnpm turbo build --concurrency=1

      - name: Verify publishable package manifests
        run: pnpm test:release

      - name: Typecheck
        run: pnpm turbo typecheck --concurrency=1

      - name: Test
        run: pnpm turbo test --concurrency=1

      - name: Check formatting and linting
        run: pnpm exec biome check .
