name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate toolkit reference
        run: pnpm docs:generate

      - name: Check generated documentation drift
        run: git diff --exit-code -- docs-site/docs.json docs-site/toolkits/generated

      - name: Validate documentation structure
        run: pnpm docs:check

      - name: Typecheck documentation snippets
        run: pnpm docs:snippets

      - name: Typecheck documentation tooling
        run: pnpm docs:typecheck

      - name: Build
        run: pnpm turbo build

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test

      - name: Check formatting and linting
        run: pnpm exec biome check .
