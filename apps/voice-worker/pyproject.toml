[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "eyeball-voice-worker"
version = "0.1.0"
description = "Persistent, versioned voice-session worker for Eyeball"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
# The base service and contract tests import no carrier or speech SDK. Production
# images install this explicit media bundle.
media = [
  "pipecat-ai[anthropic,deepgram,elevenlabs,livekit,websocket]==1.5.0",
]
dev = [
  "httpx==0.28.1",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.14",
]

[project.scripts]
eyeball-voice-worker = "eyeball_voice_worker.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eyeball_voice_worker"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["eyeball_voice_worker"]

[[tool.mypy.overrides]]
module = ["anthropic", "pipecat.*"]
ignore_missing_imports = true
